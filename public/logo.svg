<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Emerald Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Laser Scan Beam Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#6366F1" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Document Body with Shadow -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="96" width="280" height="320" rx="32" fill="url(#docGrad)"/>
    
    <!-- Document Fold Corner -->
    <path d="M336 96 L396 156 L348 156 C341.373 156 336 150.627 336 144 Z" fill="#CBD5E1"/>

    <!-- Resume Header Avatar & Name Bar -->
    <circle cx="166" cy="156" r="20" fill="#6366F1"/>
    <rect x="198" y="144" width="110" height="12" rx="6" fill="#334155"/>
    <rect x="198" y="162" width="70" height="8" rx="4" fill="#94A3B8"/>

    <!-- Resume Lines / Skills Bars -->
    <rect x="150" y="202" width="212" height="10" rx="5" fill="#64748B" fill-opacity="0.35"/>
    <rect x="150" y="226" width="180" height="10" rx="5" fill="#64748B" fill-opacity="0.35"/>
    <rect x="150" y="250" width="140" height="10" rx="5" fill="#64748B" fill-opacity="0.35"/>

    <rect x="150" y="286" width="110" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4"/>
    <rect x="150" y="306" width="130" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4"/>
  </g>

  <!-- Horizontal Laser Scan Line -->
  <rect x="110" y="240" width="292" height="4" rx="2" fill="url(#scanGrad)"/>

  <!-- Verified Checkpoint Badge (Bottom Right) -->
  <g filter="url(#checkGlow)">
    <!-- Badge Background Circle -->
    <circle cx="344" cy="344" r="76" fill="#0F172A" stroke="#1E293B" stroke-width="4"/>
    <circle cx="344" cy="344" r="64" fill="url(#checkGrad)"/>
    
    <!-- Bold Sharp White Checkmark -->
    <path d="M312 344 L334 366 L378 322" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accent (Top Right of Badge) -->
  <path d="M410 280 Q410 295 425 295 Q410 295 410 310 Q410 295 395 295 Q410 295 410 280 Z" fill="#FDE047"/>
</svg>
